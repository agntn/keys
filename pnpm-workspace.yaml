minimumReleaseAgeExclude:
  - typebox
  - vite
  - "@agntn/*"
  - obuild@0.4.43

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  vitest: 4.1.11
  vite-plus: 1.1.0

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

allowBuilds:
  "@google/genai": false
  bufferutil: false
  esbuild: true
  onnxruntime-node: false
  protobufjs: false
  utf-8-validate: false

patchedDependencies:
  micro-key-producer@0.10.2: patches/micro-key-producer@0.10.2.patch

# Stops pnpm 12 from opening the lockfile with an env document, which GitHub reads as zero dependencies.
pmOnFail: ignore
