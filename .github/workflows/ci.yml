name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Installs docs/ too: test/docs-mcp.test.ts loads the /mcp helper and its toolkit from there.
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: v26.10.0
          cache: true
          run-install: |
            - cwd: .
              args: ['--frozen-lockfile']
            - cwd: docs
              args: ['--frozen-lockfile']
      - run: pnpm lint
      - run: pnpm test:types
      - run: pnpm build
      - run: pnpm exec vp test run --coverage
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
