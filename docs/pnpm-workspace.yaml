packages:
  - .

# Without it Node walks up to the root node_modules and the server bundle can carry a second Vue.
shamefullyHoist: true

allowBuilds:
  better-sqlite3: true
  esbuild: true
  workerd: true
  vue-demi: true
  core-js-pure: false

# Workers Builds runs pnpm 12, which holds back day-old releases. The glob lets every @agntn one in.
minimumReleaseAgeExclude:
  - "@agntn/*"

# Stops pnpm 12 from opening the lockfile with an env document, which GitHub reads as zero dependencies.
pmOnFail: ignore
